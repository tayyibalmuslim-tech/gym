<!DOCTYPE html>
<!--
  دفتر التمرين — مازن
  ملاحظة: شرح طريقة أداء التمارين في هذا الملف مكتوب بمساعدة الذكاء الاصطناعي وقد يحتوي أخطاء — يُرجى المراجعة مع فيديو MuscleWiki قبل التنفيذ.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101311">
<title>دفتر التمرين — PPL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101311; --panel:#181c19; --panel2:#1f2420; --line:#2c332d;
  --text:#e9ede7; --muted:#8e998f; --olive:#9bb06a; --olive-d:#5f6f3d;
  --orange:#ff7a1a; --orange-d:#b85413; --red:#e5484d; --ok:#4cc38a;
  --heavy:#ff7a1a; --volume:#5fb3e0; --rest:#8e998f;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo",system-ui,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--olive)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 120px}

/* header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#101311 75%,rgba(16,19,17,0));padding:14px 14px 10px}
.hrow{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--olive-d);display:grid;place-items:center;font-weight:900;font-size:18px;color:#e9f2d6;letter-spacing:-1px;flex:none}
.htitle{flex:1;min-width:0}
.htitle h1{margin:0;font-size:18px;font-weight:900;line-height:1.2}
.htitle .sub{color:var(--muted);font-size:12.5px}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.prog{max-width:760px;margin:10px auto 0;height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--olive),var(--orange));width:0;transition:width .4s}
.motto{max-width:760px;margin:8px auto 0;font-size:12.5px;color:var(--olive)}

/* nav */
nav{position:fixed;bottom:0;inset-inline:0;z-index:30;background:rgba(20,24,21,.97);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px;backdrop-filter:blur(8px)}
nav button{flex:1;max-width:180px;background:none;border:0;border-radius:12px;padding:6px 4px;color:var(--muted);font-weight:700;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button .ic{font-size:19px;line-height:1}
nav button.on{color:var(--text);background:var(--panel2)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.sec-title{font-weight:900;font-size:16px;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.notes li{margin:4px 0}
.notes{padding-inline-start:18px;margin:6px 0}

/* cycle grid */
.days{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.days{grid-template-columns:repeat(4,1fr)}}
.day{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;position:relative;text-align:start;display:flex;flex-direction:column;gap:4px;min-height:118px}
.day:active{transform:scale(.98)}
.day .dn{font-size:12px;color:var(--muted);font-weight:700}
.day .nm{font-weight:900;font-size:16px;line-height:1.25}
.day .tp{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;align-self:flex-start}
.tp.heavy{background:rgba(255,122,26,.15);color:var(--heavy)}
.tp.volume{background:rgba(95,179,224,.15);color:var(--volume)}
.tp.rest{background:rgba(142,153,143,.15);color:var(--rest)}
.day .st{margin-top:auto;font-size:12px;color:var(--muted)}
.day.done{border-color:var(--olive-d)}
.day.done::after{content:"✓";position:absolute;top:8px;left:10px;color:var(--ok);font-weight:900;font-size:18px}
.day.partial::after{content:"•";position:absolute;top:2px;left:12px;color:var(--orange);font-weight:900;font-size:26px}
.minibar{height:4px;border-radius:9px;background:var(--panel2);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--olive)}

/* session */
.s-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.s-head h2{margin:0;font-size:21px;font-weight:900;flex:1}
.back{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:3px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:none}
.inp:focus{border-color:var(--olive)}
textarea.inp{min-height:62px;resize:vertical}
.mapbox{display:flex;justify-content:center}
.mapbox svg{width:100%;max-width:520px;height:auto;border-radius:12px;background:#e7ecef}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;margin-top:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.legend .p::before{background:rgba(229,72,77,.8)}
.legend .s::before{background:rgba(255,160,40,.6)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-weight:600;white-space:nowrap}
.chip.o{border-color:var(--orange-d);color:#ffb37a}
.chip.g{border-color:var(--olive-d);color:#c5d79a}

.ex{padding:0;overflow:hidden}
.ex-top{padding:14px 14px 4px;display:flex;gap:10px;align-items:flex-start}
.ex-num{width:30px;height:30px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-weight:900;flex:none;font-size:14px}
.ex.complete .ex-num{background:var(--olive-d);color:#fff}
.ex-name{flex:1;min-width:0}
.ex-name b{font-size:16.5px;font-weight:900;display:block;line-height:1.3}
.ex-name .en{font-size:12px;color:var(--muted);direction:ltr;text-align:right;display:block}
.howbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer;flex:none}
.howbtn.on{border-color:var(--olive);color:var(--olive)}
.target{padding:6px 14px 4px}
.feel{background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.28);border-radius:10px;padding:8px 10px;margin:4px 0 10px;font-size:14px;line-height:1.55}
.feel b{color:#ff9a9d}
.target .mapbox svg{max-width:560px}
.how{display:none;padding:4px 14px 12px;border-top:1px dashed var(--line);margin-top:8px}
.how.on{display:block}
.how ol{margin:8px 0;padding-inline-start:20px}
.how ol li{margin:3px 0}
.tipbox{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13.5px}
.tipbox.t{background:rgba(155,176,106,.1);border:1px solid rgba(155,176,106,.3)}
.tipbox.m{background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.3)}
.ai-note{font-size:11.5px;color:var(--muted);margin-top:8px}
.mwlink{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:#1c2a35;border:1px solid #2d4456;color:#8fd0ff;text-decoration:none;font-weight:700;border-radius:10px;padding:7px 12px;font-size:13.5px}

.sets{padding:6px 14px 12px}
.srow{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:7px;align-items:center;margin:6px 0}
.srow.hdr{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:0}
.srow .sn{font-weight:900;color:var(--muted);text-align:center}
.srow input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;font-weight:700;font-size:16px;outline:none;direction:ltr}
.srow input:focus{border-color:var(--olive)}
.srow input::placeholder{color:#59635a;font-weight:600}
.okb{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:18px;cursor:pointer;font-weight:900;color:var(--muted)}
.srow.ok .okb{background:var(--olive-d);border-color:var(--olive);color:#fff}
.srow.ok input{border-color:var(--olive-d)}
.setbtns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:4px 11px;font-size:12.5px;cursor:pointer;font-weight:700}
.rpe{display:flex;align-items:center;gap:6px;margin-inline-start:auto;font-size:12.5px;color:var(--muted);font-weight:700}
.rpe select{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:4px 6px;font-weight:700}
.exnote{margin-top:8px}
.exnote input{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);padding:6px 2px;outline:none;font-size:13.5px}
.vol{font-size:12px;color:var(--muted);margin-top:6px}

.big{display:block;width:100%;border:0;border-radius:var(--r);padding:14px;font-weight:900;font-size:16px;cursor:pointer;margin:10px 0}
.big.go{background:var(--olive);color:#141a0d}
.big.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.big.hot{background:var(--orange);color:#1b0d02}
.big.warn{background:transparent;color:var(--red);border:1px solid rgba(229,72,77,.4)}
.big small{display:block;font-weight:600;font-size:12px;opacity:.8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* timer */
#timer{position:fixed;inset-inline:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:40;max-width:520px;margin:0 auto;background:#20261f;border:1px solid var(--olive-d);border-radius:16px;padding:10px 14px;display:none;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#timer.on{display:flex}
#timer .t{font-size:28px;font-weight:900;direction:ltr;min-width:84px;text-align:center}
#timer .lbl{flex:1;font-size:12.5px;color:var(--muted);line-height:1.3}
#timer .lbl b{color:var(--text);display:block;font-size:13.5px}
#timer.end{border-color:var(--orange);animation:pulse 1s infinite}
@keyframes pulse{50%{background:#3a2410}}

.toast{position:fixed;top:16px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;z-index:60;background:#26301f;border:1px solid var(--olive);padding:9px 16px;border-radius:12px;font-weight:700;opacity:0;transform:translateY(-10px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.restcard{text-align:center;padding:26px 16px}
.restcard .em{font-size:44px}
.hidden{display:none!important}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;font-size:14px}
.kv:last-child{border:0}
/* coaching sections */
.csec{margin:10px 0}
.csec h4{margin:0 0 4px;font-size:14px;font-weight:900;display:flex;gap:6px;align-items:center}
.csec ul{margin:0;padding-inline-start:20px}
.csec li{margin:3px 0;font-size:14px}
.csec.t{background:rgba(155,176,106,.08);border:1px solid rgba(155,176,106,.28);border-radius:12px;padding:9px 11px}
.csec.b{background:rgba(95,179,224,.08);border:1px solid rgba(95,179,224,.28);border-radius:12px;padding:9px 11px}
.csec.m{background:rgba(229,72,77,.07);border:1px solid rgba(229,72,77,.3);border-radius:12px;padding:9px 11px}
.csec.t h4{color:#c5d79a}.csec.b h4{color:#9fd6f5}.csec.m h4{color:#ff9a9d}
.steps h4{margin:8px 0 2px;font-size:14px;font-weight:900}
/* sync pill */
.sync{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap;cursor:pointer}
.sync.ok{color:var(--ok);border-color:rgba(76,195,138,.35)}
.sync.saving{color:#ffd18a}
.sync.offline,.sync.error{color:#ff9a9d;border-color:rgba(229,72,77,.35)}
/* auth + onboarding */
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 16px}
#gate.hidden{display:none}
.gbox{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 22px;margin:auto}
.gbox h2{margin:0;text-align:center;font-weight:900;font-size:23px}
.gbox .gsub{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 18px}
.gtabs{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.gtabs button{flex:1;background:var(--panel2);border:0;padding:10px;font-weight:700;color:var(--muted);cursor:pointer}
.gtabs button.on{background:var(--olive-d);color:#fff}
.gf{margin-bottom:12px}
.gf label{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
.gf .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.gmsg{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:13px;text-align:center;display:none}
.gmsg.err{display:block;background:rgba(229,72,77,.1);color:#ff9a9d}
.gmsg.ok{display:block;background:rgba(76,195,138,.1);color:var(--ok)}
.glink{background:none;border:0;color:var(--olive);font-size:12.5px;cursor:pointer;display:block;margin:10px auto 0;text-decoration:underline}
.loading{text-align:center;color:var(--muted);padding:60px 0}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo">PPL</div>
    <div class="htitle">
      <h1 id="hTitle">دفتر التمرين</h1>
      <div class="sub" id="hSub"></div>
    </div>
    <span class="sync" id="hSync" title="حالة المزامنة">…</span>
    <span class="badge" id="hBadge"></span>
  </div>
  <div class="prog"><i id="hProg"></i></div>
  <div class="motto" id="motto"></div>
</header>

<main class="wrap" id="app"><div class="loading">⏳ جاري التحميل…</div></main>

<div id="timer">
  <div class="t" id="tVal">0:00</div>
  <div class="lbl"><b id="tName">راحة</b><span id="tHint">استرِح لحد ما العداد يخلص</span></div>
  <button class="mini" id="tPlus">+30</button>
  <button class="mini" id="tStop">تخطي</button>
</div>

<nav>
  <button data-nav="cycle"><span class="ic">🗓️</span>الدورة</button>
  <button data-nav="session"><span class="ic">🏋️</span>الجلسة</button>
  <button data-nav="data"><span class="ic">📦</span>حسابي والملفات</button>
</nav>
<div id="gate" class="hidden"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2500); }

function freshState(profile=null){ return {v:2, ts:Date.now(), profile, current:DEFAULT_PLAN.cycle, cycles:{[DEFAULT_PLAN.cycle]:{plan:clone(DEFAULT_PLAN), log:{}, rest:{}}}}; }
function readLocal(uid){ try{ const r=localStorage.getItem(KEY_PREFIX+uid); return r?JSON.parse(r):null; }catch(e){ return null; } }
function writeLocal(){ try{ localStorage.setItem(KEY_PREFIX+UID, JSON.stringify(S)); }catch(e){ toast("⚠️ التخزين على الجهاز مش شغال"); } }
/* تحديث خطة القالب الافتراضي لو فيه نسخة أحدث — الخطط الشخصية ما بتتلمسش */
function upgradeDefaultPlan(st){
  const c = st.cycles?.[DEFAULT_PLAN.cycle];
  if(c && (c.plan.code||"default")==="default" && (c.plan.rev||1) < (DEFAULT_PLAN.rev||1)){ c.plan = clone(DEFAULT_PLAN); planDirty.add(String(DEFAULT_PLAN.cycle)); }
  return st;
}
const C = ()=> S.cycles[S.current];
const plan = ()=> C().plan;
const sessions = ()=> plan().sessions;
const trainSessions = ()=> sessions().filter(s=>s.type!=="rest");
const P = ()=> S.profile || {};
function slog(sid){ const L=C().log; if(!L[sid]) L[sid]={date:"",bw:"",notes:"",done:false,ex:{}}; return L[sid]; }
function elog(sid, ex){
  const s=slog(sid);
  if(!s.ex[ex.id]) s.ex[ex.id]={rpe:"",note:"",sets:Array.from({length:ex.sets},()=>({w:"",r:"",ok:false}))};
  return s.ex[ex.id];
}

/* ================= الحفظ والمزامنة ================= */
let lastErr = "";
function explainErr(e){
  const c = (e && (e.code||e.message)) || "";
  if(c.includes("permission-denied") || c.includes("insufficient permissions"))
    return "Firestore رافض الحفظ (permission-denied): قواعد gym_users و gym_plans مش متضافة، أو متضافة برا بلوك match /databases/{database}/documents، أو ما اتعملهاش Publish.";
  if(c.includes("unavailable") || c.includes("offline") || c.includes("network"))
    return "مفيش اتصال بـ Firebase دلوقتي (unavailable) — هيتزامن لما النت يرجع.";
  if(c.includes("failed-precondition") || c.includes("not-found"))
    return "قاعدة بيانات Firestore مش متفعّلة في المشروع (failed-precondition).";
  if(c.includes("unauthenticated")) return "الجلسة انتهت — اعمل خروج وادخل تاني.";
  if(c.includes("resource-exhausted")) return "وصلت لحد الاستخدام المجاني في Firebase النهارده (resource-exhausted).";
  return "خطأ غير معروف: " + c;
}
let tLocal=null, tCloud=null;
function save(){
  S.ts = Date.now();
  clearTimeout(tLocal); tLocal=setTimeout(writeLocal,150);
  clearTimeout(tCloud); tCloud=setTimeout(pushCloud,1200);
  if(FB) setSync("saving");
}
function setSync(st){
  sync = st; const el=$("#hSync"); if(!el) return;
  el.className = "sync "+st;
  el.textContent = {ok:"☁️ متزامن", saving:"⏳ بيحفظ", offline:"📴 أوفلاين", error:"⚠️ مش متزامن"}[st];
}
function userDocData(){
  const cycles={};
  for(const n in S.cycles){ const c=S.cycles[n]; cycles[n]={log:c.log||{}, rest:c.rest||{}, planTitle:c.plan.title||"", planRev:c.plan.rev||1}; }
  return {email:EMAIL, profile:S.profile||null, current:S.current, cycles, ts:S.ts, v:2};
}
async function pushCloud(){
  clearTimeout(tCloud);
  if(!FB || !UID){ setSync("offline"); return; }
  const {doc,setDoc}=FB.fns;
  try{
    for(const n of [...planDirty]){
      if(!S.cycles[n]) { planDirty.delete(n); continue; }
      await setDoc(doc(FB.db, COL_PLANS, UID+"_"+n), {plan:S.cycles[n].plan, ts:Date.now()});
      planDirty.delete(n);
    }
    await setDoc(doc(FB.db, COL_USERS, UID), userDocData());
    lastErr=""; pushCloud._warned=false; setSync("ok");
  }catch(e){
    console.error("cloud save failed", e);
    lastErr = explainErr(e);
    setSync(navigator.onLine===false ? "offline" : "error");
    if(!pushCloud._warned){ pushCloud._warned=true; toast("⚠️ "+lastErr.split(":")[0]+" — التفاصيل في حسابي"); }
  }
}
async function pullCloud(){
  const {doc,getDoc}=FB.fns;
  const snap = await getDoc(doc(FB.db, COL_USERS, UID));
  if(!snap.exists()) return null;
  const d = snap.data(); const st = {v:2, ts:d.ts||0, profile:d.profile||null, current:d.current||1, cycles:{}};
  for(const n in (d.cycles||{})){
    const ps = await getDoc(doc(FB.db, COL_PLANS, UID+"_"+n));
    let pl = ps.exists() ? ps.data().plan : (+n===DEFAULT_PLAN.cycle ? clone(DEFAULT_PLAN) : null);
    if(!pl) continue;
    st.cycles[n] = {plan:pl, log:d.cycles[n].log||{}, rest:d.cycles[n].rest||{}};
  }
  if(!st.cycles[st.current]) st.current = +Object.keys(st.cycles)[0] || 1;
  if(!Object.keys(st.cycles).length) return null;
  return st;
}
const markAllPlans = ()=> Object.keys(S.cycles).forEach(n=>planDirty.add(String(n)));
document.addEventListener("visibilitychange", async ()=>{
  if(!S || !FB || !UID) return;
  if(document.visibilityState==="hidden"){ writeLocal(); pushCloud(); return; }
  try{
    const remote = await pullCloud();
    if(remote && remote.ts > S.ts){ S=upgradeDefaultPlan(remote); writeLocal(); render(); toast("🔄 اتحدثت بآخر بيانات من جهاز تاني"); }
    setSync("ok");
  }catch(e){ setSync("offline"); }
});
window.addEventListener("pagehide", ()=>{ if(S){ writeLocal(); pushCloud(); } });
window.addEventListener("online", ()=>{ if(S && FB) pushCloud(); });

/* ================= الإقلاع ================= */
async function loadFirebase(){
  const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),12000));
  const [appM, authM, fsM] = await Promise.race([Promise.all([
    import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")
  ]), timeout]);
  const app = appM.getApps().length ? appM.getApp() : appM.initializeApp(FB_CFG);
  return {auth:authM.getAuth(app), db:fsM.getFirestore(app), fns:{...authM, ...fsM}};
}
async function onLogin(user){
  UID = user.uid; EMAIL = user.email||"";
  try{ localStorage.setItem(LAST_UID, UID); }catch(e){}
  showGateMessage(`<div class="loading">⏳ بنجيب بياناتك…</div>`);
  const local = readLocal(UID);
  let remote = null, cloudOk = true;
  try{ remote = await pullCloud(); }catch(e){ cloudOk=false; console.warn(e); lastErr=explainErr(e); }
  if(remote && (!local || remote.ts >= local.ts)) S = remote;
  else if(local){ S = local; if(cloudOk){ markAllPlans(); } }
  else {
    let legacy=null; try{ const r=localStorage.getItem(LEGACY_KEY); legacy=r?JSON.parse(r):null; }catch(e){}
    if(legacy && legacy.cycles && confirm("لقيت تسجيلات تمرين قديمة على الجهاز ده (قبل نظام الحسابات). أربطها بحسابك؟")){
      S = {v:2, ts:Date.now(), profile:null, current:legacy.current||1, cycles:legacy.cycles};
      S._legacy = true;
      try{ localStorage.setItem(LEGACY_KEY+"-migrated", JSON.stringify(legacy)); localStorage.removeItem(LEGACY_KEY); }catch(e){}
    } else S = freshState(null);
    markAllPlans();
  }
  S = upgradeDefaultPlan(S);
  if(S.cycles && !S.cycles[S.current]) S.current = +Object.keys(S.cycles)[0];
  writeLocal();
  setSync(cloudOk ? "ok" : (lastErr.includes("unavailable") ? "offline" : "error"));
  if(!S.profile){
    const pre = S._legacy ? {name:"مازن", height:"181", bodyweight:"96.5", goal:GOALS[0], level:LEVELS[0], planCode:"mazen"} : {};
    delete S._legacy;
    showProfileForm(pre, true); return;
  }
  hideGate(); render();
  if(cloudOk && planDirty.size) pushCloud();
}
async function boot(){
  try{ FB = await loadFirebase(); }
  catch(e){
    FB = null; console.warn("firebase load failed", e);
    let last=null; try{ last=localStorage.getItem(LAST_UID); }catch(_){}
    const local = last ? readLocal(last) : null;
    if(local && local.profile){ UID=last; S=upgradeDefaultPlan(local); setSync("offline"); hideGate(); render(); toast("📴 شغال أوفلاين — هيتزامن لما النت يرجع وتفتح التطبيق"); return; }
    showGateMessage(`<h2>📴 مفيش إنترنت</h2><p class="gsub">أول مرة لازم تكون متصل عشان تسجل دخول. بعد كده التطبيق بيشتغل أوفلاين عادي.</p><button class="big go" onclick="location.reload()">جرّب تاني</button>`);
    return;
  }
  let was=false;
  FB.fns.onAuthStateChanged(FB.auth, user=>{
    if(user){ was=true; onLogin(user); }
    else { if(was){ location.reload(); return; } S=null; UID=null; showLogin(); }
  });
}
async function doSignOut(){
  if(!confirm("تسجيل خروج؟ بياناتك محفوظة على حسابك.")) return;
  writeLocal(); await pushCloud();
  try{ localStorage.removeItem(LAST_UID); }catch(e){}
  try{ await FB.fns.signOut(FB.auth); }catch(e){}
  location.reload();
}

/* ================= أدوات العرض ================= */
function colLabels(ex){
  if(ex.kind==="time") return ["وزن إضافي","ثواني"];
  if(ex.kind==="distance") return ["الوزن "+(ex.weightNote||""),"متر"];
  if(ex.kind==="cardio") return ["الميل / السرعة","دقائق"];
  return [ex.weight==null?"وزن إضافي":"الوزن "+(ex.weightNote?"("+ex.weightNote+")":"كجم"),"العدات"];
}
function exStats(sid, ex){
  const L=C().log[sid]?.ex?.[ex.id]; if(!L) return {done:0,total:ex.sets,vol:0};
  let done=0, vol=0;
  L.sets.forEach(s=>{ if(s.ok) done++; const w=parseFloat(s.w), r=parseFloat(s.r); if(s.ok && ex.kind==="reps" && !isNaN(w) && !isNaN(r)) vol+=w*r; });
  return {done,total:L.sets.length,vol};
}
function sessStats(s){
  if(s.type==="rest") return {done:C().rest?.[s.id]?1:0,total:1};
  let d=0,t=0; s.exercises.forEach(ex=>{ const st=exStats(s.id,ex); d+=st.done; t+=st.total; });
  return {done:d,total:t};
}
function sessionDone(s){ return s.type==="rest" ? !!C().rest?.[s.id] : !!C().log[s.id]?.done; }

/* ================= خريطة العضلات ================= */
function shapeSVG(sh, fill){
  if(sh[0]==="poly") return `<polygon points="${sh[1].map(p=>p.join(",")).join(" ")}" fill="${fill}"/>`;
  const [cx,cy,rx,ry,rot]=sh;
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${cx} ${cy})" fill="${fill}"/>`;
}
function shapeY(sh){
  if(sh[0]==="poly"){ const ys=sh[1].map(p=>p[1]); return [Math.min(...ys),Math.max(...ys)]; }
  const r=Math.max(sh[2],sh[3]); return [sh[1]-r, sh[1]+r];
}
function bodyMap(primary=[], secondary=[], crop=false){
  const Pm = new Set(primary), Sx = new Set(secondary.filter(m=>!Pm.has(m)));
  let shapes="", y0=707, y1=0;
  const draw=(m,fill)=> (MUSCLE_REG[m]||[m]).forEach(k=> (REGIONS[k]||[]).forEach(sh=>{ shapes+=shapeSVG(sh,fill); const [a,b]=shapeY(sh); y0=Math.min(y0,a); y1=Math.max(y1,b); }));
  Sx.forEach(m=>draw(m,"rgba(255,150,30,.5)"));
  Pm.forEach(m=>draw(m,"rgba(229,60,60,.62)"));
  let vy=0, vh=707;
  if(crop && y1>y0){
    vy=Math.max(0,y0-45); let ve=Math.min(707,y1+45);
    if(ve-vy<300){ const mid=(vy+ve)/2; vy=Math.max(0,Math.min(707-300,mid-150)); ve=vy+300; }
    vh=ve-vy;
  }
  return `<div class="mapbox"><svg viewBox="0 ${vy} 836 ${vh}" role="img" aria-label="خريطة العضلات">
    <g>${shapes}</g>
    <image href="${BODY_IMG}" x="0" y="0" width="836" height="707" style="mix-blend-mode:multiply"/>
    <text x="14" y="${vy+26}" text-anchor="end" font-size="22" font-weight="700" fill="#55606a" font-family="Cairo">خلف</text>
    <text x="822" y="${vy+26}" text-anchor="start" font-size="22" font-weight="700" fill="#55606a" font-family="Cairo">أمام</text>
  </svg></div>
  <div class="legend"><span class="p">عضلة أساسية: ${[...Pm].map(m=>MUSCLE_AR[m]).join("، ")||"—"}</span>${Sx.size?`<span class="s">مساعدة: ${[...Sx].map(m=>MUSCLE_AR[m]).join("، ")}</span>`:""}</div>`;
}

/* ================= شاشة الدورة ================= */
function nextSession(){ return sessions().find(s=>!sessionDone(s)) || sessions()[0]; }
function renderCycle(){
  const p=plan(); const nx=nextSession();
  let h = `<div class="sec-title">🔄 الدورة ${p.cycle} — ${sessions().length} أيام</div><div class="days">`;
  sessions().forEach(s=>{
    const st=sessStats(s), done=sessionDone(s), partial=!done && st.done>0;
    const tpl = s.type==="heavy"?"تقيل 🔥":s.type==="volume"?"حجم 💪":"راحة";
    h += `<button class="day ${done?"done":partial?"partial":""}" data-open="${s.id}">
      <span class="dn">يوم ${s.day}${s.id===nx.id&&!done?" • التالي ⬅️":""}</span>
      <span class="nm">${esc(s.ar)}</span>
      <span class="tp ${s.type}">${tpl}</span>
      <span class="st">${s.type==="rest"?(done?"اتعمل":"—"):`${st.done}/${st.total} مجموعة`}</span>
      ${s.type!=="rest"?`<span class="minibar"><i style="width:${st.total?st.done/st.total*100:0}%"></i></span>`:""}
    </button>`;
  });
  h += `</div><button class="big go" data-open="${nx.id}">ابدأ: ${esc(nx.ar)}<small>يوم ${nx.day} في الدورة</small></button>`;

document.addEventListener("click", e=>{
  if(!S) return;
  if(e.target.closest("#gate")) return;
  if(e.target.closest("#hSync")){ go("data"); return; }
  const nv=e.target.closest("[data-nav]"); if(nv){ go(nv.dataset.nav); return; }
  const op=e.target.closest("[data-open]"); if(op){ go("session", op.dataset.open); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act; const card=b.closest(".ex");
  const s = card ? sessions().find(x=>x.id===card.dataset.sid) : null;
  const ex = s ? s.exercises.find(x=>x.id===card.dataset.ex) : null;
  switch(act){
    case "how": { const k=s.id+"/"+ex.id; openHow.has(k)?openHow.delete(k):openHow.add(k); rerenderCard(card,s,ex); break; }
    case "ok": tickSet(card,s,ex,+b.dataset.k); break;
    case "addSet": { const L=elog(s.id,ex); L.sets.push({w:"",r:"",ok:false}); save(); rerenderCard(card,s,ex); break; }
    case "delSet": { const L=elog(s.id,ex); if(L.sets.length>1){ L.sets.pop(); save(); rerenderCard(card,s,ex);} break; }
    case "finish": { const L=slog(b.dataset.sid); L.done=!L.done; if(L.done && !L.date) L.date=today(); save(); toast(L.done?"💪 الجلسة اتسجلت":"اتلغى الإنهاء"); if(L.done) go("cycle"); else render(); break; }
    case "toggleRest": { const R=C().rest||(C().rest={}); R[b.dataset.sid]=!R[b.dataset.sid]; save(); toast(R[b.dataset.sid]?"تمام — الراحة جزء من التمرين":"اتلغى"); go("cycle"); break; }
    case "exportJson": exportJson(); break;
    case "exportTxt": exportTxt(); break;
    case "import": $("#fileIn").click(); break;
    case "fetchPlan": fetchPlan(); break;
    case "editProfile": showProfileForm(S.profile, false); break;
    case "syncNow": if(!FB){ toast("📴 أوفلاين — افتح التطبيق والنت شغال"); break; } markAllPlans(); setSync("saving"); pushCloud().then(()=>{ toast(sync==="ok"?"✅ اتزامن":"⚠️ المزامنة فشلت — السبب مكتوب تحت"); if(view.name==="data") render(); }); break;
    case "switch": S.current=+b.dataset.c; save(); toast("اتفتحت الدورة "+S.current); go("cycle"); break;
    case "resetCycle": if(confirm("متأكد؟ هيتمسح كل اللي سجلته في الدورة دي. (صدّر نسخة الأول)")){ C().log={}; C().rest={}; save(); render(); toast("اتمسح"); } break;
    case "signOut": doSignOut(); break;
  }
});

function rerenderCard(card,s,ex){
  const i=s.exercises.indexOf(ex);
  const tmp=document.createElement("div"); tmp.innerHTML=exCard(s,ex,i);
  card.replaceWith(tmp.firstElementChild); renderHeader();
}
function tickSet(card,s,ex,k){
  const L=elog(s.id,ex), set=L.sets[k];
  if(!set.ok){
    const prev=L.sets[k-1];
    if(set.w==="") set.w = prev&&prev.w!=="" ? prev.w : (ex.weight!=null? String(ex.weight) : (ex.kind==="cardio"?"":"0"));
    if(set.r==="") set.r = prev&&prev.r!=="" ? prev.r : (ex.kind==="cardio"?"15":firstNum(ex.reps));
    set.ok=true;
    if(!slog(s.id).date) slog(s.id).date=today();
    const allOk=L.sets.every(x=>x.ok);
    if(ex.rest && !allOk) startTimer(ex.rest, ex.ar);
    else if(ex.rest && allOk){ const nxt=s.exercises[s.exercises.indexOf(ex)+1]; if(nxt) startTimer(Math.max(ex.rest,90), "التمرين الجاي: "+nxt.ar); }
  } else set.ok=false;
  save(); rerenderCard(card,s,ex);
}

/* ================= مؤقت الراحة ================= */
let tEnd=0, tInt=null, audio=null;
function beep(){
  try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    [0,.25,.5].forEach(d=>{ const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=880; o.connect(g); g.connect(audio.destination); g.gain.setValueAtTime(.25,audio.currentTime+d); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d+.2); o.start(audio.currentTime+d); o.stop(audio.currentTime+d+.21); });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([300,120,300]); }catch(e){}
}
function startTimer(sec,name){
  try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); audio.resume&&audio.resume(); }catch(e){}
  tEnd=Date.now()+sec*1000; $("#tName").textContent="راحة — "+name; $("#tHint").textContent="استرِح لحد ما العداد يخلص";
  const T=$("#timer"); T.classList.add("on"); T.classList.remove("end");
  clearInterval(tInt); tick(); tInt=setInterval(tick,250);
}
function tick(){
  const left=(tEnd-Date.now())/1000; const T=$("#timer");
  $("#tVal").textContent=fmtT(Math.max(0,Math.ceil(left)));
  if(left<=0 && !T.classList.contains("end")){ T.classList.add("end"); $("#tHint").textContent="يلا! المجموعة الجاية 💪"; beep(); }
  if(left<-20) stopTimer();
}
function stopTimer(){ clearInterval(tInt); $("#timer").classList.remove("on","end"); }
$("#tPlus").onclick=()=>{ tEnd=Math.max(tEnd,Date.now())+30000; $("#timer").classList.remove("end"); };
$("#tStop").onclick=stopTimer;

/* ================= تصدير واستيراد ================= */
function download(name, text, type){
  const blob=new Blob([text],{type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
const fileTag = ()=> (P().planCode || (P().name||"user").replace(/\s+/g,"-"));

function exportTxt(){

    t+=`[${L.date||"—"}] — ${s.name} (${s.ar})${L.done?" ✓":""}\nCycle ${p.cycle} | Day ${s.day}${L.bw?` | Bodyweight ${L.bw} kg`:""}\n\nExercise | Target | Sets done (weight×reps) | RPE | Notes\n----------------------------------------------------------\n`;

      t+=`${ex.en} | ${ex.sets}x${ex.reps} @${ex.weight??"BW"} | ${sets||"—"} | ${E?.rpe||"—"} | ${E?.note||""}\n`;

function addPlan(pl, quiet){
  if(!pl || !Array.isArray(pl.sessions) || !pl.cycle) throw new Error("ملف جدول غير صالح");
  const n=String(pl.cycle), ex=S.cycles[n];
  if(ex && Object.keys(ex.log||{}).length && !confirm(`الدورة ${pl.cycle} موجودة وفيها تسجيلات. أحدّث الجدول وأحافظ على التسجيلات؟`)) return false;
  S.cycles[n] = {plan:pl, log: ex?.log||{}, rest: ex?.rest||{}};
  S.current=pl.cycle; planDirty.add(n); save(); toast(`✅ ${pl.title||"الدورة "+pl.cycle} جاهزة`); go("cycle"); return true;

function importObj(o){
  if(!o || o.app!=="gym-mazen") throw new Error("الملف ده مش من التطبيق");
  if(o.kind==="plan") return addPlan(o);
  if(o.kind==="backup"){
    if(!confirm("ده ملف نسخة احتياطية — هيستبدل كل تسجيلات حسابك الحالية. أكمل؟")) return;
    const prof = o.profile || S.profile;
    S={v:2, ts:Date.now(), profile:prof, current:o.current, cycles:o.cycles};
    S=upgradeDefaultPlan(S); markAllPlans(); save(); toast("✅ اتسترجعت النسخة"); go("cycle"); return;
  }
  throw new Error("نوع ملف غير معروف");
}

  const code=P().planCode; if(!code){ toast("اكتب كود الجدول في بياناتك الأول"); showProfileForm(S.profile,false); return; }
  const n=plan().cycle, cur=plan();
  try{ const nx=await getJSON(`plans/${code}/cycle-${n+1}.json`); importObj(nx); return; }catch(e){}
  try{
    const same=await getJSON(`plans/${code}/cycle-${n}.json`);
    if((same.code||"")!==(cur.code||"default") || (same.rev||1)>(cur.rev||1)){ importObj(same); return; }
    toast(`جدولك محدّث — الدورة ${n+1} لسه ما اترفعتش`);
  }catch(e){ toast(`مفيش جدول بالكود "${code}" على المستودع لسه`); }
}

boot();
</script>
</body>
</html>
